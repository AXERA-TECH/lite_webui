name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build, and preview smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Vitest 4 resolves a nested Vite 8 dependency. The npm version shipped
          # with Node 24 handles its optional esbuild peers consistently with
          # the lockfile; Node 22's bundled npm 10 currently fails npm ci.
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject conflict markers and whitespace errors
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======$|>>>>>>>)' \
            README.md src tests .github/workflows; then
            echo "::error::Unresolved merge-conflict markers found"
            exit 1
          fi

      - name: Reject internal network addresses
        run: |
          set -euo pipefail
          if git grep -n -E \
            '(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|f[cd][0-9a-f]{2}:)' \
            -- . ':!package-lock.json'; then
            echo "::error::Internal IPv4/IPv6 address found in tracked source"
            exit 1
          fi

          git diff --check

      - name: Run unit and component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Smoke-test production preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/lite-webui-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ \
              | grep -q 'AXERA Lite WebUI'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Production preview did not become ready"
            cat /tmp/lite-webui-preview.log
            exit 1
          fi

          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          asset="$(printf '%s\n' "$html" | grep -o 'assets/[^" ]*\.js' | head -n 1)"
          css="$(printf '%s\n' "$html" | grep -o 'assets/[^" ]*\.css' | head -n 1)"
          test -n "$asset"
          test -n "$css"
          curl --fail --silent --output /dev/null "http://127.0.0.1:4173/$asset"
          curl --fail --silent --output /dev/null "http://127.0.0.1:4173/$css"

      - name: Write bundle summary
        run: |
          set -euo pipefail
          {
            echo "### Lite WebUI CI summary"
            echo
            echo "- Node.js: 24.x"
            echo "- Tests: \`npm test\`"
            echo "- Production build: \`npm run build\`"
            echo "- Preview smoke test: passed"
            echo
            echo "#### Bundle size"
            echo
            echo '```text'
            du -sh dist
            echo
            echo "Largest files:"
            find dist -type f -printf '%s\t%p\n' | sort -nr | head -n 10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: lite-webui-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
